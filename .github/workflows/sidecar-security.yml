name: Local Model Security
on:
  pull_request:
    paths:
      - 'backend/local_embedding_reranker/**'
      - '.github/scripts/security_sidecar_smoke.py'
      - '.github/workflows/sidecar-security.yml'
  push:
    branches: [main]
    paths:
      - 'backend/local_embedding_reranker/**'
      - '.github/scripts/security_sidecar_smoke.py'
      - '.github/workflows/sidecar-security.yml'
permissions:
  contents: read
jobs:
  sidecar-container:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Build locked model-service runtime
        run: docker build --build-arg PRELOAD_MODELS=false --tag autoflow-sidecar-security-test backend/local_embedding_reranker
      - name: Verify container boundary and native ML dependencies
        run: python .github/scripts/security_sidecar_smoke.py
